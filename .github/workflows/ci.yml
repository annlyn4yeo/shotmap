name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, contrast, build, size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Contrast
        run: pnpm contrast

      - name: Build
        run: pnpm build

      # Hard gates: initial JS <= 90 KB gzip, initial CSS <= 20 KB gzip, each font <= 60 KB.
      # The script rebuilds first, so this step also fails on a broken build.
      - name: Size budgets
        run: pnpm size
