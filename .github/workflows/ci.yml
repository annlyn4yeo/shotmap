name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The basic checks only, about two minutes. Lighthouse took 695 s of a run of 843 s, so it and the
# parity run against a real Worker are run by hand before a release: `pnpm lh`, `pnpm inp`,
# `pnpm keyboard` and `API_URL=... vitest run` (CLAUDE.md).
jobs:
  verify:
    name: Typecheck, lint, test, contrast, build, size
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The raw StatsBomb files, pinned to one commit (packages/ingest/src/data.config.ts).
      # A cold cache downloads about 44 MB once; after that the ingest is offline.
      - name: Restore the StatsBomb cache
        uses: actions/cache@v4
        with:
          path: packages/ingest/.cache
          key: statsbomb-${{ hashFiles('packages/ingest/src/data.config.ts') }}

      # Builds the SQLite database the database tests read (they fail in CI without it), runs its
      # checks, and rewrites the static JSON, which must come out exactly as committed.
      - name: Ingest, and check the static data is unchanged
        run: |
          pnpm data
          git diff --exit-code -- apps/web/public/data

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Includes the Worker tests, which run inside workerd (the Cloudflare Vitest plugin).
      - name: Test
        run: pnpm test

      - name: Contrast
        run: pnpm contrast

      # The performance gate: initial JS <= 90 KB gzip, initial CSS <= 20 KB gzip, each font <= 60 KB.
      # The script builds first, so this also fails on a broken build.
      - name: Size budgets
        run: pnpm size
