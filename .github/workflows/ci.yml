name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, contrast, build, size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The raw StatsBomb files, pinned to one commit (packages/ingest/src/data.config.ts).
      # A cold cache downloads about 44 MB once; after that the ingest is offline.
      - name: Restore the StatsBomb cache
        uses: actions/cache@v4
        with:
          path: packages/ingest/.cache
          key: statsbomb-${{ hashFiles('packages/ingest/src/data.config.ts') }}

      # Builds the SQLite database the parity and database tests read, runs its checks
      # (coordinates, the 149/149 score identity...), and rewrites the static JSON.
      # The JSON must come out exactly as committed: that is the migration's golden master.
      - name: Ingest, and check the static data is unchanged
        run: |
          pnpm data
          git diff --exit-code -- apps/web/public/data

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Includes the Worker tests, which run inside workerd (the Cloudflare Vitest plugin).
      - name: Test
        run: pnpm test

      # The migration's safety net over HTTP: load the dump into a local D1 the way
      # `wrangler d1 execute --file` does it for staging, run the real Worker with
      # `wrangler dev`, and require all 149 matches to decode like the static files.
      - name: Parity against the running Worker
        run: |
          pnpm --filter @shotmap/api load
          pnpm --filter @shotmap/api exec wrangler dev --port 8787 --ip 127.0.0.1 > wrangler-dev.log 2>&1 &
          WORKER=$!
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/v1/meta > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8787/v1/meta > /dev/null || { cat wrangler-dev.log; exit 1; }
          API_URL=http://127.0.0.1:8787 pnpm --filter @shotmap/ingest exec vitest run src/parity.test.ts
          API_URL=http://127.0.0.1:8787 pnpm --filter @shotmap/web exec vitest run src/data/source-parity.test.ts src/data/search-http.test.ts src/data/players-http.test.ts
          API_URL=http://127.0.0.1:8787 node apps/api/scripts/latency.mjs
          kill "$WORKER"

      - name: Contrast
        run: pnpm contrast

      - name: Build
        run: pnpm build

      # Hard gates: initial JS <= 90 KB gzip, initial CSS <= 20 KB gzip, each font <= 60 KB.
      # The script rebuilds first, so this step also fails on a broken build.
      - name: Size budgets
        run: pnpm size

      # MIGRATION.md step 9: the match page on the API, measured on the built app (the default
      # build, which is the one that ships) with a local Worker behind the preview server's
      # /v1 proxy. Mobile preset, median of three runs; a miss fails the job: Performance under
      # 97, LCP over 1.6 s, or any layout shift. The hero is inlined, so these do not wait for
      # the API; the Worker is here because the page prefetches the next match.
      - name: Lighthouse
        run: |
          pnpm --filter @shotmap/api load
          pnpm --filter @shotmap/api exec wrangler dev --port 8787 --ip 127.0.0.1 > wrangler-lh.log 2>&1 &
          WORKER=$!
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/v1/meta > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8787/v1/meta > /dev/null || { cat wrangler-lh.log; exit 1; }
          status=0
          pnpm lh || status=$?
          kill "$WORKER"
          exit $status

      - name: Keep the Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: apps/web/lh-report.html
          if-no-files-found: ignore
